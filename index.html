<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ritual de Kael'Tharon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: url('https://i.imgur.com/mFZAVvZ.jpeg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'UnifrakturCook', cursive;
      color: #f1f1f1;
      text-align: center;
    }

    .overlay {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 4rem 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.3rem;
      max-width: 600px;
    }

    .ritual-button {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      background: darkred;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    .ritual-button:hover {
      background: crimson;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Ritual de Kael'Tharon</h1>
    <p>
      Você está diante de um ritual simbólico de poder e prosperidade. Ao avançar, receberá um nome oculto — sua chave simbólica para o ciclo de sorte, foco e transformação.
    </p>
    <button class="ritual-button" onclick="location.href='https://tally.so/r/mVqKWE'">
      Iniciar Ritual
    </button>
  </div>

  <audio autoplay loop>
    <source src="https://files.catbox.moe/y6bnqh.mp3" type="audio/mpeg" />
  </audio>
</body>
</html>
